version: 2
project_name: squadrn

# Releases are published in this public repository, squadrn/squadrn-cli (ADR 0007).
before:
  hooks:
    - sh scripts/render-install.sh squadrn/squadrn-cli {{ .Tag }}

builds:
  - id: unix
    main: ./cmd/squadrn
    binary: squadrn
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Reproducible: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: &ldflags
      - -s -w -X github.com/squadrn/squadrn-cli/internal/cli.Version={{ .Version }} -X github.com/squadrn/squadrn-cli/internal/cli.Repo=squadrn/squadrn-cli

  - id: windows
    main: ./cmd/squadrn
    binary: squadrn
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Reproducible: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: *ldflags
archives:
  - id: unix
    ids: [unix]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: plugin/**/*
        info: &fileinfo
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: plugin/.claude-plugin/*
        info: *fileinfo
      - src: .claude-plugin/*
        info: *fileinfo
      - src: README.md
        info: *fileinfo
      - src: LICENSE
        info: *fileinfo
      - src: NOTICE
        info: *fileinfo
      # Same basename as the root README; without an explicit dst it is dropped.
      - src: plugin/README.md
        dst: plugin/README.md
        info: *fileinfo

  # Windows: a zip with squadrn.exe, the plugin without the sh shim, and hooks that run the binary
  # through cmd.exe so a binary that cannot start blocks the tool call (ADR 0008).
  - id: windows
    ids: [windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: plugin/.claude-plugin/*
        info: &wininfo
          mtime: "{{ .CommitDate }}"
      - src: plugin/agents/*
        info: *wininfo
      - src: plugin/README.md
        dst: plugin/README.md
        info: *wininfo
      - src: scripts/hooks.windows.json
        dst: plugin/hooks/hooks.json
        info: *wininfo
      - src: .claude-plugin/*
        info: *wininfo
      - src: README.md
        info: *wininfo
      - src: LICENSE
        info: *wininfo
      - src: NOTICE
        info: *wininfo

sboms:
  - artifacts: archive

# The installers are listed too, so the signature covers them (ADR 0007).
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: build/install.sh
    - glob: build/install.ps1

# checksums.txt.sig: SSH signature (namespace squadrn-release) that self-update and install.sh
# verify against the keys in internal/release/signers.pub.
signs:
  - id: release
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: sh
    args: ["scripts/sign.sh", "${artifact}", "${signature}"]

release:
  github:
    owner: squadrn
    name: squadrn-cli
  # Tags with a pre-release suffix (v1.2.0-rc.1) reach the beta channel only.
  prerelease: auto
  # A draft until the release workflow's upgrade jobs pass; its publish job makes it visible.
  draft: true
  replace_existing_draft: true
  extra_files:
    - glob: build/install.sh
    - glob: build/install.ps1

# Release notes come from CHANGELOG.md (--release-notes), never from commit messages.
changelog:
  disable: true
